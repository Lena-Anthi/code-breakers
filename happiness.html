<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>find your happiness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Quicksand:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pink: #f84b94;
        --purple: #6c4dd9;
        --cream: #fff8e8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #302346;
        background: radial-gradient(circle at top, #fff1f7, #f5f5dc 65%);
        background-image: url("website background.jpg");
        background-size: cover;
        font-family: "Quicksand", sans-serif;
      }
      main {
        width: min(100%, 600px);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        color: var(--pink);
        font-size: clamp(1.8rem, 6vw, 3rem);
        font-family: "Comic Relief", system-ui;
      }
      .intro {
        margin: 0 0 22px;
        font-family: "Comic Relief", system-ui;
        font-size: 30px;
        font-weight: 700;
      }
      .wheel-area {
        position: relative;
        width: min(86vw, 440px);
        aspect-ratio: 1;
        margin: 0 auto 24px;
      }
      .pointer {
        position: absolute;
        z-index: 2;
        top: -14px;
        left: 50%;
        width: 0;
        height: 0;
        transform: translateX(-50%);
        border-right: 18px solid transparent;
        border-left: 18px solid transparent;
        border-top: 42px solid var(--purple);
        filter: drop-shadow(0 3px 2px #0003);
      }
      .wheel {
        width: 100%;
        height: 100%;
        border: 10px solid var(--cream);
        border-radius: 50%;
        background: conic-gradient(
          #ff7aa9 0deg 45deg,
          #ffd166 45deg 90deg,
          #70d6ff 90deg 135deg,
          #b8e986 135deg 180deg,
          #c8a2ff 180deg 225deg,
          #ff9f68 225deg 270deg,
          #7de2d1 270deg 315deg,
          #f7aef8 315deg 360deg
        );
        box-shadow:
          0 10px 24px #6c4dd933,
          0 0 0 5px var(--purple);
        transition: transform 4s cubic-bezier(0.12, 0.8, 0.18, 1);
      }
      .wheel::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 64px;
        height: 64px;
        transform: translate(-50%, -50%);
        border: 7px solid var(--cream);
        border-radius: 50%;
        background: var(--purple);
        box-shadow: 0 2px 5px #0003;
      }
      .labels {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        transition: transform 4s cubic-bezier(0.12, 0.8, 0.18, 1);
      }
      .labels span {
        position: absolute;
        width: 90px;
        color: #302346;
        font-size: clamp(0.7rem, 2.5vw, 0.9rem);
        font-weight: 400;
        text-align: center;
        font-family: "Comic Relief", system-ui;
      }
      .labels span:nth-child(1) {
        transform: translate(56px, -134px) rotate(22.5deg);
      }
      .labels span:nth-child(2) {
        transform: translate(134px, -56px) rotate(67.5deg);
      }
      .labels span:nth-child(3) {
        transform: translate(134px, 56px) rotate(112.5deg);
      }
      .labels span:nth-child(4) {
        transform: translate(56px, 134px) rotate(157.5deg);
      }
      .labels span:nth-child(5) {
        transform: translate(-56px, 134px) rotate(202.5deg);
      }
      .labels span:nth-child(6) {
        transform: translate(-134px, 56px) rotate(247.5deg);
      }
      .labels span:nth-child(7) {
        transform: translate(-134px, -56px) rotate(292.5deg);
      }
      .labels span:nth-child(8) {
        transform: translate(-56px, -134px) rotate(337.5deg);
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 15px 28px;
        color: white;
        background: var(--pink);
        font: inherit;
        font-family: "Comic Relief", system-ui;
        cursor: pointer;
        box-shadow: 0 5px 0 #c73370;
      }
      button:hover {
        background: #e33d83;
      }
      button:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #c73370;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }
      #result {
        min-height: 28px;
        margin: 22px 0 0;
        color: var(--purple);
        font-family: "Comic Relief", system-ui;
        font-size: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Wheel of fortune</h1>
      <p class="intro">Spin the wheel</p>
      <section class="wheel-area" aria-label="Lucky wheel">
        <div class="pointer" aria-hidden="true"></div>
        <div class="wheel" id="wheel"></div>
        <div class="labels" aria-hidden="true">
          <span>You deserve happiness too.</span>
          <span>Be proud of how far you've come.</span>
          <span>You have the power to make today better.</span>
          <span>Don't forget to be kind to yourself.</span>
          <span>Your smile can brighten someone's day.</span>
          <span>Be present.Be connected.Be you.</span>
          <span>You are enough just as you are.</span>
          <span>Spin the wheel again.</span>
        </div>
      </section>
      <button id="spin-button" type="button">Spin the wheel!</button>
      <p id="result" aria-live="polite"></p>
    </main>
    <script>
      const wheel = document.querySelector("#wheel");
      const labels = document.querySelector(".labels");
      const spinButton = document.querySelector("#spin-button");
      const result = document.querySelector("#result");
      const spinSound = new Audio("Fortune-wheel-spinning.mp3");
      const options = [
        "You deserve happiness too",
        "Be proud of how far you've come",
        "You have the power to make today better",
        "Don't forget to be kind to yourself",
        "Your smile can brighten someone's day",
        "Be present. Be connected. Be you",
        "You are enough just as you are",
        "Spin the wheel again",
      ];
      let rotation = 0;
      spinButton.addEventListener("click", () => {
        spinSound.currentTime = 0;
        spinSound.play().catch(() => {});
        const selectedIndex = Math.floor(Math.random() * options.length);
        const segmentSize = 360 / options.length;
        const targetAngle =
          360 - (selectedIndex * segmentSize + segmentSize / 2);
        rotation += 5 * 360 + targetAngle - (rotation % 360);
        wheel.style.transform = `rotate(${rotation}deg)`;
        labels.style.transform = `rotate(${rotation}deg)`;
        spinButton.disabled = true;
        result.textContent = "The wheel is spinning...";
        window.setTimeout(() => {
          result.textContent = `Your daily boost...: ${options[selectedIndex]}!`;
          spinButton.disabled = false;
        }, 4100);
      });
    </script>
  </body>
</html>
